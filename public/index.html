<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section id="auth-view" class="auth-card">
        <p class="eyebrow">DASHBOARD_</p>
        <h1>Built by you. For you.</h1>
        <p>Sign in to build your personal dashboard.</p>
        <form id="login-form">
          <label>Username <input name="username" autocomplete="username" required></label>
          <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
          <button>Sign in</button>
        </form>
        <details>
          <summary>Create an account</summary>
          <form id="register-form">
            <label>Username <input name="username" required minlength="3"></label>
            <label>Email <input name="email" type="email" required></label>
            <label>Password <input name="password" type="password" required minlength="8"></label>
            <button>Create account</button>
          </form>
        </details>
        <p id="auth-message" class="message" role="status"></p>
      </section>

      <section id="dashboard-view" hidden>
        <header>
          <div><p class="eyebrow">DASHBOARD_</p><h1>Your space</h1></div>
          <div class="header-actions"><span id="user-name"></span><button id="logout-button" class="secondary">Log out</button></div>
        </header>
        <section class="add-panel">
          <h2>Add a widget</h2>
          <form id="widget-form">
            <label>Service <select id="service" required></select></label>
            <label>Widget <select id="widget" required></select></label>
            <div id="configuration" class="configuration"></div>
            <label>Refresh every (seconds) <input id="refresh-rate" type="number" min="10" value="60" required></label>
            <button>Add widget</button>
          </form>
          <p id="dashboard-message" class="message" role="status"></p>
        </section>
        <section><h2>Your widgets</h2><div id="widget-grid" class="widget-grid"></div></section>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
